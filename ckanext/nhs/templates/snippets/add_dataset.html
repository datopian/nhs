{# Adds 'Add Dataset' button #}

{% set dataset_type = dataset_type if dataset_type else 'dataset' %}

{% if group %}
    {# Link for adding dataset to a specific group #}
    <a href="{{ url_for('dataset.new', group=h.get_organization_id_from_path()) }}" class="btn btn-primary btn-add-dataset">
        <i class="fa fa-plus-square"></i>
        {{ _('Add Dataset') }}
    </a>
{% else %}
    {# Link for adding a general dataset #}
    <a href="{{ url_for('dataset.new') }}" class="btn btn-primary btn-add-dataset">
        <i class="fa fa-plus-square"></i>
        {{ _('Add ' + dataset_type.title()) }}
    </a>
{% endif %}
