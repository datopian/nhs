{#
render a list of tags linking to the dataset search page
tags: list of tags
#}
{% set _class = _class or 'tag-list' %}
{% block tag_list %}
    <ul class="tags">
    {% for tag in tags %}
        <li>
            <a class="{% block tag_list_item_class %}custom-tag{% endblock %}" href="{{ h.url_for('dataset.search', tags=tag.name) }}">{{ tag.display_name|truncate(22) }}</a>
        </li>
    {% endfor %}
    </ul>
{% endblock %}
